name: ci

on:
  push:
    branches: [main, developer, "chore/**", "ci/**", "feat/**", "fix/**", "docs/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COVERAGE_IGNORE: '/main\.rs$'

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: soldi
          POSTGRES_PASSWORD: soldi
          POSTGRES_DB: soldi
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U soldi -d soldi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://soldi:soldi@localhost:5441/soldi
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-deny
      - run: cargo deny check advisories
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - run: sqlx migrate run --source crates/soldi-server/migrations
      - run: cargo sqlx prepare --workspace --check
      - run: >
          cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE"
          --fail-under-lines 90 --fail-under-functions 90 --fail-under-regions 90

  branch-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: soldi
          POSTGRES_PASSWORD: soldi
          POSTGRES_DB: soldi
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U soldi -d soldi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://soldi:soldi@localhost:5441/soldi
      SQLX_OFFLINE: "true"
      # rust-toolchain.toml pins stable; branch coverage needs nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - run: >
          cargo llvm-cov --workspace --branch --ignore-filename-regex "$COVERAGE_IGNORE"
          --json --summary-only --output-path coverage.json
      - name: Enforce 90% branch coverage
        run: |
          jq -r '.data[0].files[] | select(.summary.branches.count > .summary.branches.covered)
            | "\(.filename): \(.summary.branches.covered)/\(.summary.branches.count) branches"' coverage.json
          jq -e '.data[0].totals.branches | .count == 0 or .percent >= 90' coverage.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: soldi
          POSTGRES_PASSWORD: soldi
          POSTGRES_DB: soldi
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U soldi -d soldi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://soldi:soldi@localhost:5441/soldi
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip until web/playwright.config.ts exists
        id: suite
        run: test -f web/playwright.config.ts && echo "present=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.suite.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - if: steps.suite.outputs.present == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.suite.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - if: steps.suite.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: steps.suite.outputs.present == 'true'
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm build
        working-directory: web
      - if: steps.suite.outputs.present == 'true'
        run: cargo build -p soldi-server
      - if: steps.suite.outputs.present == 'true'
        name: Start the server with the web export
        run: |
          PORT=8089 SOLDI_WEB_DIR=web/out SOLDI_IP_LIMITS=off target/debug/soldi-server > server.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8089/api/health && exit 0; sleep 1; done
          cat server.log
          exit 1
      - if: steps.suite.outputs.present == 'true'
        run: pnpm e2e
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8089

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t soldi:ci .
