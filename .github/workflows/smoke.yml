name: smoke

# One Playwright pass against production after each release (SOL-129); a failed run e-mails the owner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Wait for production to serve this release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          expected="${VERSION#v}"
          for _ in $(seq 60); do
            deployed=$(curl -sf https://getsoldi.app/api/health | jq -r .version || true)
            [ "$deployed" = "$expected" ] && exit 0
            echo "production serves ${deployed:-nothing}, waiting for $expected"; sleep 10
          done
          echo "::error::production did not serve $expected within 10 minutes"
          exit 1
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install chromium
      # Same as ci.yml: an Ubuntu mirror outage must not fail the run.
      - name: Install Chromium system libraries
        run: |
          for attempt in 1 2 3; do
            sudo pnpm exec playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying"; sleep 20
          done
          echo "::warning::Chromium system libraries could not be installed; running with the image's own"
      - run: pnpm exec playwright test e2e/smoke.spec.ts
        env:
          SMOKE: "1"
          E2E_BASE_URL: https://getsoldi.app
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
