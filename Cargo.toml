[workspace]
resolver = "3"
members = ["crates/soldi-types", "crates/soldi-server"]

[workspace.package]
version = "0.47.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/emersonjds/soldi"

[workspace.dependencies]
soldi-types = { path = "crates/soldi-types" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "chrono", "rust_decimal", "uuid", "json"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10", default-features = false }
rust_decimal = { version = "1", features = ["serde-with-str"] }
utoipa = { version = "6", features = ["chrono", "decimal", "uuid"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "fs", "set-header", "timeout"] }
argon2 = "0.6"
sha2 = "0.11"
getrandom = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly)"] }

# argon2 is unusably slow unoptimized; tests hash passwords.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
