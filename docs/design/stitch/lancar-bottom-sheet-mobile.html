<script>
  // Micro-interactions for Keypad and Segmented Controls
  (function() {
    const display = document.getElementById('amount-display');
    const keys = document.querySelectorAll('.keypad-key');
    const backspace = document.getElementById('btn-backspace');
    const submitBtn = document.getElementById('btn-submit');
    
    // Numeric Entry Simulation
    keys.forEach(k => {
      k.addEventListener('click', () => {
        const val = k.innerText.trim();
        if (!display) return;
        if (display.innerText === '0,00' || display.innerText === '0') {
          display.innerText = val === ',' ? '0,' : val;
        } else {
          if (val === ',' && display.innerText.includes(',')) return;
          if (display.innerText.length < 9) {
            display.innerText += val;
          }
        }
      });
    });

    if (backspace) {
      backspace.addEventListener('click', () => {
        if (!display) return;
        if (display.innerText.length > 1) {
          display.innerText = display.innerText.slice(0, -1);
        } else {
          display.innerText = '0';
        }
      });
    }

    // Gentle tactile feedback on submit
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        submitBtn.classList.add('scale-95');
        const origText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Registrando...</span>';
        setTimeout(() => {
          submitBtn.classList.remove('scale-95');
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span><span>Pronto!</span>';
          setTimeout(() => {
            submitBtn.innerHTML = origText;
          }, 1200);
        }, 600);
      });
    }
  })();
