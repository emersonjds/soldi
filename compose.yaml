# `docker compose up -d postgres`: PostgreSQL for development and tests on localhost:5441.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: soldi
      POSTGRES_PASSWORD: soldi
      POSTGRES_DB: soldi
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - soldi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soldi -d soldi"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  soldi-postgres:
